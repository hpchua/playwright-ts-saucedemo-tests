# This workflow ONLY deploys a pre-generated report folder.
# It does NOT run any tests.
name: Deploy Pre-generated Playwright Report

on:
    workflow_dispatch:
    push:
        branches: [main]

jobs:
    test-and-deploy:
        runs-on: ubuntu-latest

        permissions:
            pages: write 
            id-token: write 

        steps:
            # 1. Bumped from v4 to v5 (Node 24 compatibility)
            - name: Checkout repository
              uses: actions/checkout@v5

            # 2. Bumped from v4 to v5 (Node 24 compatibility)
            - name: Set up Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 18 

            - name: Install dependencies
              run: npm install

            - name: Install Playwright Browsers
              run: npx playwright install --with-deps

            - name: Run Playwright tests
              run: npx playwright test
              continue-on-error: true

            - name: Install Allure Commandline
              run: npm install -g allure-commandline

            - name: Generate Allure Report
              run: allure generate allure-results --clean -o allure-report

            # 8. Bumped from v3 to v4
            - name: Upload test report artifact
              uses: actions/upload-pages-artifact@v4
              with:
                  path: allure-report/
                  retention-days: 30

            # 9. Bumped from v4 to v5
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
